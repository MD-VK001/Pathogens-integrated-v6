name: Build Pathogen Guide APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository contents
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. Install required Android SDK components
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      # 5. Locate and extract the Kotlin project ZIP
      - name: Extract PathogenGuide project
        run: |
          mkdir -p build-source

          ZIP_FILE=$(find . -maxdepth 3 -type f \
            \( -name "PathogenGuide-Kotlin-native-v6.0.zip" \
            -o -name "*PathogenGuide*.zip" \) \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: PathogenGuide ZIP file was not found."
            exit 1
          fi

          echo "Found project ZIP: $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d build-source

          echo "Extracted files:"
          find build-source -maxdepth 3 -type f | head -100

      # 6. Find the Android project root
      - name: Locate Gradle project
        run: |
          PROJECT_DIR=$(find build-source -type f -name "settings.gradle.kts" \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle.kts was not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      # 7. Install Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # 8. Build the debug APK
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug --stacktrace

      # 9. Find the generated APK
      - name: Locate APK
        run: |
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p final-apk
          cp "$APK" "final-apk/PathogenGuide-v6.0-debug.apk"

      # 10. Upload APK to GitHub Actions
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PathogenGuide-v6.0-debug-apk
          path: final-apk/PathogenGuide-v6.0-debug.apk
          if-no-files-found: error
          retention-days: 30
